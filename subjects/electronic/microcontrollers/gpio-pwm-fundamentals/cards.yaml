cards:
  - id: "elec-mcu-gpiopwm-001"
    type: "qa"
    question: "Why does a floating digital input pin read unreliable, undefined values?"
    answer: "Nothing is actively driving the pin high or low, so its voltage is determined by noise rather than a defined logic level, making its read value unpredictable."
    options: []
    tags: ["gpio", "floating-pin"]
    weight_seed: 1.0

  - id: "elec-mcu-gpiopwm-002"
    type: "qa"
    question: "What does a pull-up or pull-down resistor do for a digital input pin?"
    answer: "It weakly biases the pin to a known default state (high for pull-up, low for pull-down) when nothing else is actively driving it, so the pin reads reliably instead of floating."
    options: []
    tags: ["gpio", "pull-up-resistor"]
    weight_seed: 1.1

  - id: "elec-mcu-gpiopwm-003"
    type: "qa"
    question: "What does PWM duty cycle control, and what is a GPIO pin fundamentally unable to output without it?"
    answer: "Duty cycle is the fraction of each cycle spent high, which determines the effective average level a downstream circuit sees; a GPIO pin can only be fully on or off, so PWM is how it fakes an intermediate analog-ish output."
    options: []
    tags: ["pwm", "duty-cycle"]
    weight_seed: 1.1

  - id: "elec-mcu-gpiopwm-004"
    type: "qa"
    question: "Why is PWM normally generated by a hardware timer peripheral rather than a software loop toggling the pin?"
    answer: "A hardware timer produces precise, consistent on/off switching without consuming CPU time in a loop; software toggling would be imprecise and wastefully occupy the processor."
    options: []
    tags: ["pwm", "timer-peripheral"]
    weight_seed: 1.2

  - id: "elec-mcu-gpiopwm-005"
    type: "mcq"
    question: "A hobby servo's position PWM signal typically uses which characteristic to encode target position, rather than a duty-cycle percentage?"
    answer: "Pulse width"
    options: ["Pulse width", "Signal amplitude", "Number of pulses per second", "Duty cycle percentage"]
    tags: ["pwm", "servo"]
    weight_seed: 1.2

  - id: "elec-mcu-gpiopwm-006"
    type: "qa"
    question: "Why would running DC motor PWM at too low a switching frequency cause the motor to audibly whine or vibrate?"
    answer: "If the PWM switching frequency falls within an audible/mechanically-resonant range, the motor's coils and structure physically respond to each switching cycle, producing an audible or vibrational artifact at that frequency."
    options: []
    tags: ["pwm", "dc-motor"]
    weight_seed: 1.3

  - id: "elec-mcu-gpiopwm-007"
    type: "qa"
    question: "Are a hobby servo's PWM position signal and a DC motor's PWM speed-control signal generally interchangeable?"
    answer: "No -- despite both being called PWM, a servo signal encodes position via pulse width at a specific low frequency (~50Hz), while motor speed control uses duty cycle at a much higher frequency; sending one type of signal to a device expecting the other will not work correctly."
    options: []
    tags: ["pwm", "servo", "dc-motor"]
    weight_seed: 1.3
