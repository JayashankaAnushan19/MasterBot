topic: "imu-fundamentals"
pillar: "electronic"
module: "sensors"
difficulty_base: 2
cards:
  - id: "elec-sens-imu-001"
    type: "qa"
    question: "What three sensors typically make up a 9-DOF IMU?"
    answer: "A 3-axis accelerometer, a 3-axis gyroscope, and a 3-axis magnetometer."
    options: []
    tags: ["imu", "sensors"]
    weight_seed: 1.0

  - id: "elec-sens-imu-002"
    type: "qa"
    question: "Why does a gyroscope-only orientation estimate suffer from drift over time?"
    answer: "Orientation is obtained by integrating angular velocity over time, so any small constant sensor bias or noise accumulates and grows without bound in the integrated result."
    options: []
    tags: ["gyroscope", "drift"]
    weight_seed: 1.2

  - id: "elec-sens-imu-003"
    type: "qa"
    question: "Why can't an accelerometer alone be trusted as a 'which way is down' reference during dynamic motion like braking or turning?"
    answer: "An accelerometer measures the combination of gravity and the robot's own linear acceleration, and it can't distinguish between the two, so under dynamic motion its gravity-direction estimate becomes unreliable."
    options: []
    tags: ["accelerometer", "sensor-fusion"]
    weight_seed: 1.2

  - id: "elec-sens-imu-004"
    type: "mcq"
    question: "Which IMU component provides an absolute yaw (heading) reference?"
    answer: "Magnetometer"
    options: ["Accelerometer", "Gyroscope", "Magnetometer", "Barometer"]
    tags: ["magnetometer"]
    weight_seed: 1.0

  - id: "elec-sens-imu-005"
    type: "qa"
    question: "Why is a magnetometer on a mobile robot particularly prone to error near motors and power electronics?"
    answer: "Nearby ferrous metal and current-carrying wires distort the local magnetic field, which throws off the magnetometer's heading estimate, and motors/power electronics are commonly mounted close to the IMU."
    options: []
    tags: ["magnetometer", "sensor-error"]
    weight_seed: 1.2

  - id: "elec-sens-imu-006"
    type: "qa"
    question: "Describe the core idea of a complementary filter fusing accelerometer and gyroscope data."
    answer: "Low-pass filter the accelerometer (trusting its slow, long-term absolute gravity reference) and high-pass filter the gyroscope (trusting its accurate short-term relative change), combining the two so the accelerometer corrects the gyro's slow drift without adopting its noisy short-term jitter."
    options: []
    tags: ["complementary-filter", "sensor-fusion"]
    weight_seed: 1.4

  - id: "elec-sens-imu-007"
    type: "mcq"
    question: "Compared to a complementary filter, what does a Kalman filter add for IMU sensor fusion?"
    answer: "It statistically weights each sensor by its estimated uncertainty and propagates a full state estimate over time"
    options: ["It statistically weights each sensor by its estimated uncertainty and propagates a full state estimate over time", "It ignores the gyroscope entirely", "It requires no calibration", "It only works with magnetometers"]
    tags: ["kalman-filter", "sensor-fusion"]
    weight_seed: 1.3

  - id: "elec-sens-imu-008"
    type: "qa"
    question: "Why can an IMU never give you reliable absolute position on its own, even with good sensor fusion?"
    answer: "Position requires integrating acceleration twice, and any small error compounds rapidly through a double integration, so absolute position needs an external reference like GPS, visual odometry, or wheel encoders fused in."
    options: []
    tags: ["imu", "position-estimation"]
    weight_seed: 1.3
